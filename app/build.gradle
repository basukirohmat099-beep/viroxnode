plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aerovista.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aerovista.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
